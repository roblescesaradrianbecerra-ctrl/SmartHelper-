name: Build Android AAB
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Damos permiso directo al archivo que ya está en tu repositorio
      - name: Grant execute permission
        run: chmod +x gradlew

      # Construimos sin complicaciones
      - name: Build
        run: ./gradlew assembleDebug
