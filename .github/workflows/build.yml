name: Build Android AAB
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Esto genera el archivo gradlew automáticamente
      - name: Setup Gradle Wrapper
        run: gradle wrapper

      # Ahora ya existirá el archivo
      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build AAB
        run: ./gradlew :app:bundleDebug
